name: Linux CI
on: [push, pull_request]
jobs:
  build:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ["clang", "gcc"]
    steps:
    - uses: actions/checkout@v4
    - name: Enforce No Raw GL Calls In Non-Backend Files
      run: python3 python/check_no_raw_gl_calls.py
    - name: Enforce GL Symbol Boundaries
      run: python3 python/check_gl_symbol_boundaries.py
    - name: Check Renderer Plugin ABI Contract
      run: python3 python/check_renderer_plugin_abi.py
    - name: Check FrameGraph Pass Contracts
      run: python3 python/check_framegraph_pass_contracts.py
    - name: Install Dependencies
      run: sudo apt update && sudo apt install libcurl4-openssl-dev libmpg123-dev libsdl2-dev libvorbis-dev
    - name: Compile Menu Units (syntax-only)
      run: ./scripts/ci_menu_compile_units.sh
    - name: Build
      run: make --jobs=3 --keep-going --directory=Quake CC=${{ matrix.compiler }}
