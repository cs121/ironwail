name: macOS CI
on: [push, pull_request]
jobs:
  build:
    name: macOS
    runs-on: macos-12
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v4
    - name: Enforce No Raw GL Calls In Non-Backend Files
      run: python3 python/check_no_raw_gl_calls.py
    - name: Check Renderer Plugin ABI Contract
      run: python3 python/check_renderer_plugin_abi.py
    - name: Check FrameGraph Pass Contracts
      run: python3 python/check_framegraph_pass_contracts.py
    - name: Install Dependencies
      run: brew install libvorbis mad sdl2
    - name: Build
      run: make --jobs=3 --keep-going --directory=Quake COMMON_LIBS="-framework CoreFoundation -framework IOKit -framework OpenGL -Wl,-alias -Wl,_SDL_main -Wl,_main"
